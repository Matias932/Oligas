plugins {
    id 'com.android.application'
}

// Change the engine version from gradle.properties if Maven resolution ever fails.
def libtorrent4jVersion = project.findProperty('libtorrent4jVersion') ?: '2.1.0-39'

android {
    namespace 'com.stroku.p2p'
    compileSdk 35

    defaultConfig {
        applicationId 'com.stroku.p2p'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        // The Galaxy S26 is arm64-only; shipping a single ABI keeps the APK small.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Real torrent engine: libtorrent (C++) bundled in the APK through JNI.
    implementation "org.libtorrent4j:libtorrent4j:${libtorrent4jVersion}"
    implementation "org.libtorrent4j:libtorrent4j-android-arm64:${libtorrent4jVersion}"
}
